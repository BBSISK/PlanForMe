services:
  - type: web
    name: planner
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --preload --workers 2 --timeout 90
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: TZ
        value: Europe/Dublin
      - key: SECRET_KEY
        generateValue: true
      - key: API_TOKEN
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false   # Neon or Render Postgres connection string
      - key: OWNER_NAME
        sync: false
      - key: OWNER_PROFILE
        sync: false   # the "about me" text from data/profile.local.txt
      - key: PLANNER_SEED_JSON
        sync: false   # contents of data/seed.local.json, read once on first start
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
